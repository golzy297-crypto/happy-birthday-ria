<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE9DF" />
      <stop offset="50%" stop-color="#E5DCCE" />
      <stop offset="100%" stop-color="#D9CDBB" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF9ED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E5DCCE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <circle cx="400" cy="240" r="280" fill="url(#sunGlow)" />

  <!-- Subtle Film Frame Border -->
  <rect x="40" y="40" width="720" height="520" rx="12" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45" />

  <!-- Nostalgic Icon: Polaroid / Sun & Horizon -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <!-- Mountain Horizon Silhouette -->
    <path d="M -160 120 L -60 20 L 20 80 L 90 25 L 160 120 Z" fill="#CBBFAA" opacity="0.5" />
    <path d="M -120 120 L -20 50 L 50 100 L 110 55 L 180 120 Z" fill="#BFAF96" opacity="0.6" />

    <!-- Distant Sun -->
    <circle cx="0" cy="-20" r="32" fill="#D4AF67" opacity="0.65" />

    <!-- Compass / Spark Icon -->
    <path d="M 0 -80 L 5 -60 L 25 -60 L 8 -46 L 14 -26 L 0 -38 L -14 -26 L -8 -46 L -25 -60 L -5 -60 Z" fill="#C5A059" opacity="0.8" />
  </g>

  <!-- Handwritten Style Label -->
  <text x="400" y="450" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" fill="#5A5249" text-anchor="middle" letter-spacing="1">
    Our Little Corner of Time
  </text>
  <text x="400" y="485" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#8C7F70" text-anchor="middle" letter-spacing="3" text-transform="uppercase">
    Memory Preserved
  </text>
</svg>
